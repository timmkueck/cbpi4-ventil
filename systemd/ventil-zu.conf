# Zusatz fuer den CraftBeerPi-Dienst: Ventil-GPIO vor dem Start und nach jedem Ende
# (auch Absturz oder kill -9) auf "zu" setzen. Ablage:
#   /etc/systemd/system/craftbeerpi.service.d/ventil-zu.conf
# 9 = Ventil-GPIO (HAT mit Ventilausgaengen, J20 V5), dl = Ausgang LOW = zu.
# Alter HAT ohne Ventilausgaenge: 19 (Relais J13). Relais zieht bei LOW an? Dann dh statt dl.
[Service]
ExecStartPre=-/usr/bin/pinctrl set 9 op dl
ExecStopPost=-/usr/bin/pinctrl set 9 op dl
Environment=LG_WD=/tmp
