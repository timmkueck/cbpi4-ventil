# Zusatz fuer den CraftBeerPi-Dienst: Ventil-GPIO vor dem Start und nach jedem Ende
# (auch Absturz oder kill -9) auf "zu" setzen. Ablage:
#   /etc/systemd/system/craftbeerpi.service.d/ventil-zu.conf
# 19 = Ventil-GPIO, dl = Ausgang LOW. Relais zieht bei LOW an? Dann dh statt dl.
[Service]
ExecStartPre=-/usr/bin/pinctrl set 19 op dl
ExecStopPost=-/usr/bin/pinctrl set 19 op dl
Environment=LG_WD=/tmp
